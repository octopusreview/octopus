name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          BETTER_AUTH_SECRET: "build-time-dummy-secret"

      - name: Test Terraform backend hardening regression
        run: bun test lib/__tests__/terraform-backend-security.test.ts
        working-directory: apps/web

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: |
          terraform fmt -check -recursive terraform/bootstrap/aws-state
          terraform fmt -check terraform/stacks/aws-ec2/versions.tf

      - name: Test state-backend bootstrap
        run: |
          terraform -chdir=terraform/bootstrap/aws-state init -backend=false -input=false
          terraform -chdir=terraform/bootstrap/aws-state validate
          terraform -chdir=terraform/bootstrap/aws-state test

      - name: Test AWS application stack
        run: |
          terraform -chdir=terraform/stacks/aws-ec2 init -backend=false -input=false
          terraform -chdir=terraform/stacks/aws-ec2 validate
          terraform -chdir=terraform/stacks/aws-ec2 test

  agent-task-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: octopus
          POSTGRES_PASSWORD: octopus
          POSTGRES_DB: octopus_agent_task_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U octopus -d octopus_agent_task_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://octopus:octopus@localhost:5432/octopus_agent_task_test"
      RUN_AGENT_TASK_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Create isolated test schema
        run: bun run db:push

      - name: Test agent task result unit coverage
        run: bun test lib/__tests__/agent-task-security.test.ts
        working-directory: apps/web

      - name: Test agent task ownership against PostgreSQL
        run: bun test lib/__tests__/agent-task-security.db.test.ts
        working-directory: apps/web
