name: Community review persistence PostgreSQL tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  community-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install pinned Bun from npm registry
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          archive="$RUNNER_TEMP/bun-1.3.4.tgz"
          bindir="$RUNNER_TEMP/octopus-bun"
          curl --fail --silent --show-error --location \
            https://registry.npmjs.org/@oven/bun-linux-x64-baseline/-/bun-linux-x64-baseline-1.3.4.tgz \
            --output "$archive"
          printf '%s  %s\n' '64c18f6c53ea986fd5609bfad43f98d55ed3db78cf2b9eef625ef260b6a49a44d18c6eaf709d009216f6a91d625bde2b1ef7c40637ae543019069f10a7da3258' "$archive" | sha512sum --check --status
          mkdir -p "$bindir"
          tar -xzf "$archive" -C "$bindir" --strip-components=2 package/bin/bun
          ln -s bun "$bindir/bunx"
          test "$("$bindir/bun" --version)" = 1.3.4
          printf '%s\n' "$bindir" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: Test community persistence against disposable PostgreSQL
        run: bash scripts/test-community-persist-db.sh
