name: Release Docker image to GHCR

# RC tags build once, using the base application version. Stable tags only
# retag the same-source, accepted RC digests. WDC rollout is separate.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  # ── changelog gate ─────────────────────────────────────────────────────────
  # Block a release that has no customer-facing CHANGELOG.md entry for its
  # version, so the public /docs/changelog can never silently fall behind.
  # Content stays human-curated (scripts/bump-version.sh stamps [Unreleased]
  # into the version) — we only ENFORCE the entry exists, never auto-write prose.
  verify-changelog:
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      lane: ${{ steps.metadata.outputs.lane }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Validate release tag, manifests and changelog
        id: metadata
        run: |
          python3 -m unittest discover -s scripts -p 'test_*images.py'
          python3 scripts/release_images.py metadata

  # ── self-host distribution image (PUBLIC package) ──────────────────────────
  selfhost:
    needs: [verify-changelog]
    if: needs.verify-changelog.outputs.lane == 'rc'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # No QEMU: builds are linux/amd64 only on an amd64 runner, so emulation
      # setup is pure overhead. Add setup-qemu-action back if arm64 is added.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The org enforces read-only GITHUB_TOKEN for workflows, so it can't
          # push to GHCR. Use a dedicated PAT (repo secret GHCR_PAT) scoped to
          # write:packages instead of broadening the org-wide token policy.
          password: ${{ secrets.GHCR_PAT }}

      - name: Derive image tags
        id: tags
        run: |
          REF_NAME=${GITHUB_REF#refs/tags/}
          SEMVER=${REF_NAME#v}
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build + push image (self-host distribution)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          # The self-host distribution lives on a SEPARATE package
          # (octopusreview/octopus-selfhost) which is PUBLIC, so self-hosters can
          # `docker compose pull` it. The private `octopus` package holds only
          # the hosted-deploy variant below — keeping prod images off the public
          # package. Visibility is per-package, which is why they're split.
          tags: |
            ${{ steps.tags.outputs.image_name }}-selfhost:${{ steps.tags.outputs.semver }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify-changelog.outputs.version }}
          build-args: |
            NEXT_PUBLIC_BUILD_ID=${{ github.sha }}
            NEXT_PUBLIC_APP_VERSION=${{ needs.verify-changelog.outputs.version }}
            # Ships the Updates page + nav entry (gated on this build-time flag).
            # No app-slug/pubby baked here — safe to publish publicly.
            NEXT_PUBLIC_OCTOPUS_SELF_HOSTED=true
          # Distinct cache scope per variant — with the shared default scope the
          # two builds would overwrite each other's cache every release.
          cache-from: type=gha,scope=selfhost
          cache-to: type=gha,mode=max,scope=selfhost

  # ── hosted-deploy image (PRIVATE package) ──────────────────────────────────
  # NEXT_PUBLIC_* values are inlined into the client bundle at build time, so
  # the hosted instance needs its own build: selfHosted OFF, plus the instance's
  # GitHub App slug + Pubby key (both are client-exposed identifiers, not
  # secrets — they ship in every page's JS — hence repo *variables*). Pushes an
  # RC-specific hosted tag. Missing build variables leave no digest and block
  # receipt publication; a green skipped build cannot qualify for promotion.
  prod:
    needs: [verify-changelog]
    if: needs.verify-changelog.outputs.lane == 'rc'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Derive image tags
        id: tags
        run: |
          REF_NAME=${GITHUB_REF#refs/tags/}
          SEMVER=${REF_NAME#v}
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build + push image (hosted deploy variant)
        id: build
        if: ${{ vars.NEXT_PUBLIC_PUBBY_KEY != '' && vars.NEXT_PUBLIC_GITHUB_APP_SLUG != '' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.image_name }}:${{ steps.tags.outputs.semver }}-prod
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify-changelog.outputs.version }}
          build-args: |
            NEXT_PUBLIC_BUILD_ID=${{ github.sha }}
            NEXT_PUBLIC_APP_VERSION=${{ needs.verify-changelog.outputs.version }}
            NEXT_PUBLIC_GITHUB_APP_SLUG=${{ vars.NEXT_PUBLIC_GITHUB_APP_SLUG }}
            NEXT_PUBLIC_PUBBY_KEY=${{ vars.NEXT_PUBLIC_PUBBY_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          # Auth token for Sentry source-map upload — mounted as a build secret
          # (kept out of image layers). Unset → upload is skipped, build still
          # succeeds. Only the hosted (private) image uploads; the self-host job
          # passes neither DSN nor token.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod

  # Standalone connector image, versioned in the existing PUBLIC distribution
  # package. Its dedicated tag never moves the self-host app tags or latest alias.
  forgejo-connector:
    needs: [verify-changelog]
    if: needs.verify-changelog.outputs.lane == 'rc'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Derive connector tags
        id: tags
        run: |
          SEMVER=${GITHUB_REF#refs/tags/v}
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-selfhost" >> "$GITHUB_OUTPUT"
      - name: Build and push connector
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/forgejo-connector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:forgejo-connector-${{ steps.tags.outputs.semver }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify-changelog.outputs.version }}
          cache-from: type=gha,scope=forgejo-connector
          cache-to: type=gha,mode=max,scope=forgejo-connector

  rc-receipt:
    needs: [verify-changelog, selfhost, prod, forgejo-connector]
    if: needs.verify-changelog.outputs.lane == 'rc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Require all variant digests and record RC source
        run: python3 scripts/release_images.py receipt
        env:
          SELFHOST_DIGEST: ${{ needs.selfhost.outputs.digest }}
          PROD_DIGEST: ${{ needs.prod.outputs.digest }}
          FORGEJO_CONNECTOR_DIGEST: ${{ needs.forgejo-connector.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-images-${{ github.run_attempt }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 90

  promote:
    needs: [verify-changelog]
    if: needs.verify-changelog.outputs.lane == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Promote accepted RC digests without rebuilding
        run: python3 scripts/release_images.py promote
        env:
          GH_TOKEN: ${{ github.token }}
          # Maintainer-selected successful isolated acceptance run, never a digest override.
          ACCEPTANCE_RUN_ID: ${{ vars.OCTOPUS_RC_ACCEPTANCE_RUN_ID }}

  release:
    needs: [verify-changelog, rc-receipt, promote]
    if: >-
      ${{ !cancelled() && needs.verify-changelog.result == 'success' &&
          ((needs.verify-changelog.outputs.lane == 'rc' && needs.rc-receipt.result == 'success') ||
           (needs.verify-changelog.outputs.lane == 'stable' && needs.promote.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Derive semver
        id: tags
        run: |
          REF_NAME=${GITHUB_REF#refs/tags/}
          echo "semver=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
          prerelease: ${{ needs.verify-changelog.outputs.lane == 'rc' }}
          make_latest: ${{ needs.verify-changelog.outputs.lane == 'stable' && 'true' || 'false' }}
          body: |
            RC images use the base application version and do not move latest aliases.
            Stable images promote accepted RC digests without rebuilding.

            Octopus Cloud can now connect to private LAN/VPN Forgejo through a local
            connector. Choose your setup at https://octopus-review.ai/docs/integrations#forgejo.
            The standalone connector image is
            `ghcr.io/octopusreview/octopus-selfhost:forgejo-connector-${{ steps.tags.outputs.semver }}`.

            Before upgrading, read this version's [Upgrade notes](https://github.com/${{ github.repository }}/blob/v${{ steps.tags.outputs.semver }}/CHANGELOG.md).
            They specify the order for updating services and applying migrations.
            Schema prerequisites may need migrations first; a new model catalog
            entry may need compatible web and review workers running first.

            Prepare the self-hosted upgrade:

            ```bash
            git fetch --tags && git checkout vX.Y.Z    # for the compose file + migrations
            export OCTOPUS_VERSION=${{ steps.tags.outputs.semver }}
            docker compose -f docker-compose.selfhost.yml pull
            ```

            Follow the Upgrade notes before running `docker compose -f docker-compose.selfhost.yml up -d`
            and `bunx prisma migrate deploy` from `packages/db` with your configured
            `DATABASE_URL`. The runtime image ships no migrations; use the tag checkout.

            Then verify:

            ```bash
            curl -fsS http://localhost:43300/api/health    # expect {"status":"ok"}
            curl -fsS http://localhost:43300/api/version   # confirm the new version
            ```

            The in-app Updates page (Settings → System → Updates) shows when a new
            release is available, along with this upgrade snippet.
