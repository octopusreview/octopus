name: Repository transfer PostgreSQL tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  repository-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Test repository transfers against disposable PostgreSQL
        run: bash scripts/test-repository-transfer-db.sh
