name: Sentry breadcrumb privacy tests

on:
  pull_request:
    paths:
      - 'apps/web/lib/sentry-scrub.ts'
      - 'apps/web/lib/__tests__/sentry-scrub.test.ts'
      - 'apps/web/lib/__tests__/sentry-breadcrumb*'
      - 'apps/web/lib/__tests__/fixtures/sentry-breadcrumb*'
      - 'apps/web/sentry.*.config.ts'
      - 'apps/web/instrumentation-client.ts'
      - 'bun.lock'
      - '.github/workflows/sentry-breadcrumb-test.yml'
  push:
    branches: [master]
    paths:
      - 'apps/web/lib/sentry-scrub.ts'
      - 'apps/web/lib/__tests__/sentry-scrub.test.ts'
      - 'apps/web/lib/__tests__/sentry-breadcrumb*'
      - 'apps/web/lib/__tests__/fixtures/sentry-breadcrumb*'
      - 'apps/web/sentry.*.config.ts'
      - 'apps/web/instrumentation-client.ts'
      - 'bun.lock'
      - '.github/workflows/sentry-breadcrumb-test.yml'

permissions:
  contents: read

jobs:
  breadcrumb-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OCTOPUS_TEST_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - name: Test breadcrumb privacy in the SDK and Chrome
        run: bun test apps/web/lib/__tests__/sentry-scrub.test.ts apps/web/lib/__tests__/sentry-breadcrumb-sdk.test.ts apps/web/lib/__tests__/sentry-breadcrumb.browser.test.ts
