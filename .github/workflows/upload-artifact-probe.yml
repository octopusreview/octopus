name: upload-artifact probe (temporary, never merge)

# Proves the pinned upload-artifact v7 still produces what scripts/release_images.py
# reads: one zipped artifact named rc-images-<attempt> holding only receipt.json.
on:
  pull_request:
    paths:
      - .github/workflows/upload-artifact-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Write a synthetic receipt
        run: echo '{"synthetic":true,"run_id":${{ github.run_id }},"run_attempt":${{ github.run_attempt }}}' > receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc-images-${{ github.run_attempt }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 1
